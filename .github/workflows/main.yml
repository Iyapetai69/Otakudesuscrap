name: Otakudesu Tor Scraper
on:
  schedule: [{cron: '0 16 * * *'}]  # 23:00 WIB
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Install Tor
      run: |
        sudo apt update
        sudo apt install -y tor xvfb
    - name: Config Tor (Control Port Open)
      run: |
        sudo sed -i 's/#ControlPort 9051/ControlPort 9051/' /etc/tor/torrc
        sudo sed -i 's/#HashedControlPassword /HashedControlPassword 16:872860B76453A77D60CA2BB8C1A7042072093276A3D701AD684053EC4C/' /etc/tor/torrc  # Empty pass
        sudo service tor start
        sleep 15  # Extra wait buat Tor boot stabil
        # Test Tor
        curl --socks5 localhost:9050 https://check.torproject.org/api/ip || echo "Tor ready"
    - name: Setup Chrome (Auto Deps)
      uses: browser-actions/setup-chrome@v2
      with:
        version: 'latest'  # Chrome terbaru
        install-dependencies: true  # Auto install nss3, gbm1, dll. – bye libgconf error
    - name: Install Python Deps
      run: |
        pip install -r requirements.txt
    - name: Run Tor Scraper
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
        python scraper.py
      env:
        TOR_CONTROL_PORT: 9051
    - name: Commit Outputs
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "TorBot"
        git add outputs/
        git commit -m "Tor Update $(date +'%Y-%m-%d')" || echo "No changes"
        git push
    - uses: actions/upload-artifact@v4
      with: {name: tor-outputs, path: outputs/, retention-days: 7}
